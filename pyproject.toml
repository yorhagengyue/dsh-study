[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-study"
version = "0.1.0"
description = "Independent configured material inputs for DSH"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dsh-study = "dsh_study.__main__:main"

[tool.setuptools.packages.find]
include = ["dsh_study*"]
