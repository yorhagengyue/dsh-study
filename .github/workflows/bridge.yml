name: Bridge platform checks
on:
  pull_request:
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cross-platform bridge checks without credentials or model requests
        run: node --test bridge/tests/*.test.mjs
      - name: Install pinned MCP SDK
        run: npm ci --prefix bridge/mcp --ignore-scripts
      - name: MCP protocol checks without model credentials
        run: npm test --prefix bridge/mcp
