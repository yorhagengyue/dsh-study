<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH 学习连接</title><link rel="stylesheet" href="/study/app.css"><script src="/study/app.js" defer></script></head><body>
<header><h1>DSH 学习连接 <small>v0.2 初期版</small></h1><a href="/">原生 DSH 会话</a></header>
<p id="health" role="status">正在确认连接…</p><p id="error" role="alert"></p>
<section><h2>个人背景</h2><p>从这台电脑的个人规则与明确引用的资料中自动整理；保留出处和未知项。原文件保持原样。</p><details><summary>添加其他来源（可选）</summary><label for="sourcePaths">Markdown、文本或用户历史 JSONL 的完整路径，每行一个</label><textarea id="sourcePaths" rows="2"></textarea></details><button id="onboard">自动发现并导入背景</button><button id="sourcesButton">查看来源覆盖</button><pre id="sources" hidden></pre><details><summary id="profileTitle">背景尚未载入</summary><div id="profile"></div></details></section>
<section><h2>下达任务</h2><form id="taskForm"><label for="goal">用自己的话说希望弄懂什么</label><textarea id="goal" required rows="4" placeholder="我还分不清业务流程和软件功能。结合我学的课，用一个生活例子讲清楚，再问一个检验理解的问题。"></textarea><label for="effort">DSH 思考程度</label><select id="effort"><option value="off">关闭</option><option value="low" selected>低</option><option value="high">高</option><option value="max">最高</option></select><label><input type="checkbox" id="continue">接着当前任务修改</label><button type="submit" id="send">发送</button></form></section>
<main><aside><h2>任务记录</h2><label><input id="follow" type="checkbox" checked>自动展示新任务</label><div id="runs"></div></aside><article aria-live="polite"><h2 id="title">等待任务</h2><p id="status"></p><p id="time"></p><button id="cancel" hidden>停止任务</button><p id="summary"></p><h3>实际输出</h3><pre id="answer">从这里或 Codex API 发送的任务都会自动出现在此处。</pre><details><summary>完整输入、输出与指标</summary><pre id="log"></pre><button id="eventsButton">读取完整公开工具记录</button><pre id="events"></pre></details><p id="evidence"></p></article></main>
</body></html>
